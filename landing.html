<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alles Gute JIJU Family</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#0d1a16;color:#fff;font-family:'Outfit',sans-serif;font-weight:300;
  display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative
}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(ellipse at 12% 8%, rgba(90,200,170,.28) 0%, transparent 55%),
    radial-gradient(ellipse at 90% 20%, rgba(250,215,110,.18) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 95%, rgba(120,215,190,.16) 0%, transparent 55%)}

/* 좌우 필름 스트립 */
.strip{position:fixed;top:0;bottom:0;width:22px;background:#08120f;z-index:2;
  display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:16px 0}
.strip.l{left:0}.strip.r{right:0}
.strip span{width:9px;height:7px;border-radius:2px;background:#f0ebe0;opacity:.4}

.wrap{position:relative;z-index:3;text-align:center;padding:0 32px;max-width:560px}
.eb{font-size:9.5px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:#7fe3c4;margin-bottom:20px}
.h1{font-family:'Libre Baskerville',serif;font-size:clamp(1.7rem,5vw,2.6rem);line-height:1.25;color:#fff;letter-spacing:-.02em}
.h1 em{font-style:italic;color:#7fe3c4}
.de{font-size:12px;color:#ffd97d;margin-top:16px;letter-spacing:.08em;font-weight:400}
.nm{margin-top:26px;display:flex;flex-wrap:wrap;justify-content:center;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:500}
.nm span+span::before{content:'·';margin:0 10px;color:rgba(255,255,255,.28)}

.btn{
  margin-top:38px;display:inline-flex;align-items:center;gap:10px;
  background:#7fe3c4;color:#0d1a16;font-family:'Outfit',sans-serif;font-weight:600;font-size:14px;
  letter-spacing:.02em;padding:15px 32px;border-radius:999px;text-decoration:none;
  transition:transform .2s ease, box-shadow .2s ease;box-shadow:0 8px 24px rgba(127,227,196,.25)
}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(127,227,196,.35)}
.btn svg{width:16px;height:16px}

.rg{margin-top:20px;font-size:9.5px;letter-spacing:.1em;color:rgba(255,255,255,.4)}

@media(max-width:520px){.strip{display:none}}
</style>
</head>
<body>

<div class="strip l"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div class="strip r"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

<div class="wrap">
  <div class="eb">Family Archive · Film Roll</div>
  <h1 class="h1">우리의 시간을<br><em>다시 펼쳐보다</em></h1>
  <div class="de">Unsere Zeit in Bildern festhalten</div>
  <div class="nm"><span>박지형</span><span>박주형</span><span>채유리</span><span>박철의</span></div>

  <a class="btn" href="https://deseisen.github.io/family-album/" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    가족 앨범 보러가기
  </a>

  <div class="rg">2007 — 2025 · 18년의 기록</div>
</div>

</body>
</html>
